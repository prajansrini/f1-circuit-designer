<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Circuit Designer — Create Race Tracks</title>
    <meta name="description"
        content="Design Formula 1 race circuits with variable track width, surface types, sectors, pit lanes, zones, and grandstands.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header id="top-bar">
        <div class="top-left">
            <div class="logo"><span class="logo-f1">F1</span><span class="logo-sep"></span><span
                    class="logo-text">Circuit Designer</span></div>
            <div class="circuit-name-wrap"><input type="text" id="circuit-name" value="Untitled Circuit"
                    spellcheck="false"></div>
        </div>
        <div class="top-center">
            <button id="btn-undo" class="top-btn" title="Undo (Ctrl+Z)"><svg width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 10h13a4 4 0 010 8H9" />
                    <path d="M3 10l4-4M3 10l4 4" />
                </svg>Undo</button>
            <button id="btn-redo" class="top-btn" title="Redo (Ctrl+Y)"><svg width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10H8a4 4 0 000 8h7" />
                    <path d="M21 10l-4-4M21 10l-4 4" />
                </svg>Redo</button>
        </div>
        <div class="top-right">
            <button id="btn-save" class="top-btn">Save</button>
            <button id="btn-load" class="top-btn">Load</button>
            <button id="btn-export" class="top-btn">Export Editor</button>
            <button id="btn-clear" class="top-btn danger">Clear</button>
        </div>
    </header>

    <div id="workspace">
        <aside id="toolbar">
            <div class="toolbar-section">
                <button class="tool-btn" data-tool="select" title="Select (V)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
                    </svg><span>Select</span></button>
                <button class="tool-btn active" data-tool="draw" title="Draw (P)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z" />
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                    </svg><span>Draw</span></button>
            </div>
            <div class="toolbar-sep"></div>
            <div class="toolbar-section">
                <button class="tool-btn" data-tool="width" title="Width (W)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 3H3v18h18V3z" />
                        <path d="M9 3v18M15 3v18" />
                    </svg><span>Width</span></button>
                <button class="tool-btn" data-tool="surface" title="Surface (S)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 22l1-1h3l9-9" />
                        <path d="M16 3l5 5-9.5 9.5" />
                    </svg><span>Surface</span></button>
                <button class="tool-btn" data-tool="barrier" title="Barrier (B)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="3" y1="15" x2="21" y2="15" />
                    </svg><span>Barrier</span></button>
            </div>
            <div class="toolbar-sep"></div>
            <div class="toolbar-section">
                <button class="tool-btn" data-tool="sector" title="Sectors (1)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 2a10 10 0 014.5 1.5" />
                    </svg><span>Sectors</span></button>
                <button class="tool-btn" data-tool="turn" title="Turns (T)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </svg><span>Turns</span></button>
                <button class="tool-btn" data-tool="zone" title="Zones (Z)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="6" width="20" height="12" rx="2" />
                        <line x1="12" y1="6" x2="12" y2="18" />
                    </svg><span>Zones</span></button>
                <button class="tool-btn" data-tool="pitlane" title="Pit Lane (L)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12h16" />
                        <path d="M4 12c0-4 3-8 8-8" />
                        <path d="M20 12c0 4-3 8-8 8" />
                    </svg><span>Pit Lane</span></button>
                <button class="tool-btn" data-tool="garage" title="Garages (R)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="8" width="18" height="13" rx="1" />
                        <path d="M3 8l9-5 9 5" />
                        <line x1="9" y1="21" x2="9" y2="14" />
                        <line x1="15" y1="21" x2="15" y2="14" />
                    </svg><span>Garage</span></button>
                <button class="tool-btn" data-tool="grandstand" title="Stands (G)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="6" width="20" height="12" rx="1" />
                        <line x1="2" y1="10" x2="22" y2="10" />
                        <line x1="2" y1="14" x2="22" y2="14" />
                    </svg><span>Stands</span></button>
            </div>
            <div class="toolbar-sep"></div>
            <div class="toolbar-section">
                <button class="tool-btn" data-tool="eraser" title="Eraser (E)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 20H7L3 16l10-10 8 8-4 4" />
                        <path d="M6 11l8 8" />
                    </svg><span>Eraser</span></button>
            </div>
            <div class="toolbar-spacer"></div>
            <div class="toolbar-section">
                <button class="tool-btn toggle" id="btn-grid" title="Grid (#)"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="3" y1="15" x2="21" y2="15" />
                        <line x1="9" y1="3" x2="9" y2="21" />
                        <line x1="15" y1="3" x2="15" y2="21" />
                    </svg><span>Grid</span></button>
            </div>
        </aside>

        <div id="editor-container">
            <div class="pane-label">EDITOR</div>
            <canvas id="main-canvas"></canvas>
            <div id="canvas-hint"><span>Scroll to zoom · Alt+Drag to pan</span></div>
        </div>

        <div id="center-column">
            <button id="btn-generate" class="generate-btn" title="Generate circuit map preview">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                <span>Generate<br>Map</span>
            </button>

            <!-- Layer visibility checkboxes -->
            <div class="layer-toggles">
                <div class="layer-title">Map Layers</div>
                <label class="layer-item"><input type="checkbox" id="cb-show-nodes" checked><span>Show
                        Nodes</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="track"
                        checked><span>Track</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="sectors"
                        checked><span>Sectors</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="turnNumbers"
                        checked><span>Turn Numbers</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="zones"
                        checked><span>Zones</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="straightMode"
                        checked><span>Straight Mode Zones</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="pitLane" checked><span>Pit
                        Lane</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="garages"
                        checked><span>Team Garages</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="grandstands"
                        checked><span>Grandstands</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="direction"
                        checked><span>Direction Arrow</span></label>
                <label class="layer-item"><input type="checkbox" class="layer-cb" data-layer="info"
                        checked><span>Circuit Info</span></label>
            </div>

            <div id="properties-panel">
                <div class="panel-header"><span class="panel-title">Properties</span></div>
                <div id="panel-content">
                    <p class="prop-hint">Select a tool to begin</p>
                </div>
            </div>

            <div class="panel-footer">
                <div class="shortcuts-title">Shortcuts</div>
                <div class="shortcut"><kbd>V</kbd> Select</div>
                <div class="shortcut"><kbd>P</kbd> Draw</div>
                <div class="shortcut"><kbd>W</kbd> Width</div>
                <div class="shortcut"><kbd>S</kbd> Surface</div>
                <div class="shortcut"><kbd>B</kbd> Barrier</div>
                <div class="shortcut"><kbd>T</kbd> Turns</div>
                <div class="shortcut"><kbd>1</kbd> Sectors</div>
                <div class="shortcut"><kbd>Z</kbd> Zones</div>
                <div class="shortcut"><kbd>L</kbd> Pit Lane</div>
                <div class="shortcut"><kbd>R</kbd> Garages</div>
                <div class="shortcut"><kbd>G</kbd> Stands</div>
                <div class="shortcut"><kbd>E</kbd> Eraser</div>
            </div>
        </div>

        <div id="preview-container">
            <div class="pane-label">CIRCUIT MAP PREVIEW</div>
            <canvas id="preview-canvas"></canvas>
            <button id="btn-download-map" class="download-btn" title="Download as PNG (1920×1080)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Download Map (1920×1080)
            </button>
        </div>
    </div>

    <footer id="status-bar">
        <span id="status-coords" class="status-item">X: 0 Y: 0</span>
        <span id="status-zoom" class="status-item">100%</span>
        <span id="status-tool" class="status-item accent">Draw Track</span>
        <span id="status-info" class="status-item">Ready</span>
    </footer>

    <script src="js/circuit-data.js"></script>
    <script src="js/track-editor.js"></script>
    <script src="js/canvas-renderer.js"></script>
    <script src="js/preview-renderer.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/ui-manager.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
